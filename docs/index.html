<script>
// TCO計算エンジン(純関数のみ・DOM非依存)

const DEFAULT_SETTINGS = {
  fuelCorrection: 0.85,      // 実燃費 = WLTC × 0.85
  importMaintFactor: 1.5,    // 輸入車の整備費係数
  elecPricePerKwh: 31,       // EVの電気単価(円/kWh)
};

// ---- 税金・法定費用 --------------------------------------------------------

// 自動車税(年額・2019年10月以降の新規登録車の税率)。EVは1,000cc以下区分扱い(25,000円)
function autoTax(cc, isEv) {
  if (isEv) return 25000;
  if (cc <= 660) return 10800;             // 軽自動車税
  if (cc <= 1000) return 25000;
  if (cc <= 1500) return 30500;
  if (cc <= 2000) return 36000;
  if (cc <= 2500) return 43500;
  if (cc <= 3000) return 50000;
  if (cc <= 3500) return 57000;
  if (cc <= 4000) return 65500;
  if (cc <= 4500) return 75500;
  if (cc <= 6000) return 87000;
  return 110000;
}

// 重量税(車検1回=2年分)。軽は定額、普通車は0.5tごと。エコカー減税は半額に簡略化
// carAge: 車検時点の車齢。13年超/18年超で重課(EVは対象外)
function weightTaxPerShaken(weightKg, isKei, ecoFlag, carAge = 0, isEv = false) {
  let base;
  if (isKei) {
    base = !isEv && carAge > 18 ? 8800 : !isEv && carAge > 13 ? 8200 : 6600;
  } else {
    const perHalfTonYear = !isEv && carAge > 18 ? 6300 : !isEv && carAge > 13 ? 5700 : 4100;
    base = Math.ceil(weightKg / 500) * perHalfTonYear * 2;
  }
  return ecoFlag ? Math.round(base / 2) : base;
}

// 自賠責保険料(24ヶ月/36ヶ月・2023年度料率の概算)
const JIBAISEKI = { m24: 17650, m36: 23690, m24kei: 17540, m36kei: 23520 };

// ---- 残価率 ---------------------------------------------------------------

// 車齢yearsAge時点の残価率(%)。0年=100%、3/5/7/10年テーブルの4点線形補間、10年超は年-2pt(下限5%)
function residualRate(resid, yearsAge) {
  if (yearsAge > 10) return Math.max(resid.y10 - 2 * (yearsAge - 10), 5);
  const pts = [
    [0, 100],
    [3, resid.y3],
    [5, resid.y5],
    [7, resid.y7],
    [10, resid.y10],
  ];
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    if (yearsAge <= x1) return y0 + ((y1 - y0) * (yearsAge - x0)) / (x1 - x0);
  }
  return resid.y10;
}

// 走行距離補正: 年1万km基準。総走行が基準を超えた分、1万kmごとに-3pt(下限5%)
function mileageAdjustedRate(rate, totalKm, yearsAge) {
  const excess = totalKm - yearsAge * 10000;
  if (excess <= 0) return Math.max(rate, 5);
  const steps = Math.floor(excess / 10000);
  return Math.max(rate - 3 * steps, 5);
}

// ---- 車検 -----------------------------------------------------------------

// 保有期間中の車検回数(購入時の初回登録分は除く)。新車: 3年目→以降2年ごと。中古: 2年ごと
// 保有終了年ちょうどの車検は受けずに手放す前提で t < years
function shakenYears(years, isUsed) {
  const list = [];
  let t = isUsed ? 2 : 3;
  while (t < years) {
    list.push(t);
    t += 2;
  }
  return list;
}

// ---- メイン計算 -----------------------------------------------------------

// car: data.jsの1要素
// opts: { years, annualKm, fuelPrice, parkingMonthly, insuranceAnnual, sell(bool), buyAge(購入時車齢: 0=新車) }
function calcTCO(car, opts, settings = DEFAULT_SETTINGS) {
  const { years, annualKm, parkingMonthly, insuranceAnnual, sell } = opts;
  const buyAge = opts.buyAge || 0;
  const used = buyAge > 0;
  const fuelPrice = car.fuelPrice != null ? car.fuelPrice : opts.fuelPrice;
  const isKei = !car.ev && car.cc <= 660; // EVはcc:0でも軽扱いにしない
  const maintFactor = car.import ? settings.importMaintFactor : 1;

  // 取得価格(中古 = 新車価格 × 購入時車齢の残価率。4点補間をそのまま使用)
  const acquisition = used ? car.price * (residualRate(car.resid, buyAge) / 100) : car.price;

  // 売却価格(車齢 = 購入時車齢 + 保有年数)
  const carAgeAtSale = years + buyAge;
  const totalKmOnCar = annualKm * years + buyAge * 10000; // 中古は前オーナー年1万km想定
  let salePrice = 0;
  if (sell) {
    let rate = residualRate(car.resid, carAgeAtSale);
    rate = mileageAdjustedRate(rate, totalKmOnCar, carAgeAtSale);
    salePrice = car.price * (rate / 100);
  }

  // 自動車税(初度登録13年超は15%重課。EVは対象外)。保有t年目の車齢 = 中古なら+3
  const taxBase = autoTax(car.cc, !!car.ev);
  let taxTotal = 0;
  const ageOffset = buyAge;
  for (let t = 1; t <= years; t++) {
    const carAge = ageOffset + t;
    taxTotal += !car.ev && carAge > 13 ? taxBase * 1.15 : taxBase;
  }

  // 車検(重量税+自賠責は購入時の初回分も payment としてカウント)
  const shakens = shakenYears(years, used);
  const initialJibai = used ? (isKei ? JIBAISEKI.m24kei : JIBAISEKI.m24) : (isKei ? JIBAISEKI.m36kei : JIBAISEKI.m36);
  const perShakenJibai = isKei ? JIBAISEKI.m24kei : JIBAISEKI.m24;
  // 重量税は車検時点の車齢で重課判定(新車初回=車齢0で3年分、中古初回=車齢3)
  const wtInitial = used
    ? weightTaxPerShaken(car.weight, isKei, !!car.eco, buyAge, !!car.ev)
    : Math.round(weightTaxPerShaken(car.weight, isKei, !!car.eco, 0, !!car.ev) * 1.5);
  const wtShakens = shakens.reduce(
    (sum, t) => sum + weightTaxPerShaken(car.weight, isKei, !!car.eco, ageOffset + t, !!car.ev),
    0
  );
  const legalTotal = wtInitial + initialJibai + wtShakens + shakens.length * perShakenJibai;

  // 車検整備費(法定費用除く)
  const maintBase = isKei ? 40000 : car.import ? 90000 : 60000;
  const shakenMaint = shakens.length * maintBase * maintFactor;

  // 燃料費(EVは電費×電気単価、それ以外はWLTC×補正×燃料単価)
  let fuelTotal;
  if (car.ev) {
    fuelTotal = (annualKm / car.kmPerKwh) * settings.elecPricePerKwh * years;
  } else {
    const realFuelEcon = car.wltc * settings.fuelCorrection;
    fuelTotal = (annualKm / realFuelEcon) * fuelPrice * years;
  }

  // 任意保険・駐車場
  const insuranceTotal = insuranceAnnual * years;
  const parkingTotal = parkingMonthly * 12 * years;

  // 消耗品: タイヤ(4万kmごと・距離比例)+ オイル等(年15,000円、輸入車は係数)
  const ownKm = annualKm * years;
  const tireUnit = isKei ? 40000 : car.import ? 100000 : 60000;
  const tireTotal = (ownKm / 40000) * tireUnit;
  const oilTotal = 15000 * maintFactor * years;
  const consumableTotal = tireTotal + oilTotal;

  const depreciation = acquisition - salePrice;
  const total =
    depreciation + taxTotal + legalTotal + shakenMaint + fuelTotal + insuranceTotal + parkingTotal + consumableTotal;

  return {
    car,
    acquisition: Math.round(acquisition),
    salePrice: Math.round(salePrice),
    breakdown: {
      depreciation: Math.round(depreciation),
      tax: Math.round(taxTotal),
      shaken: Math.round(legalTotal + shakenMaint),
      fuel: Math.round(fuelTotal),
      insurance: Math.round(insuranceTotal),
      parking: Math.round(parkingTotal),
      consumables: Math.round(consumableTotal),
    },
    total: Math.round(total),
    perYear: Math.round(total / years),
    shakenCount: shakens.length,
  };
}

function calcAll(cars, opts, settings = DEFAULT_SETTINGS) {
  return cars.map((c) => calcTCO(c, opts, settings)).sort((a, b) => a.perYear - b.perYear);
}

if (typeof module !== "undefined") {
  module.exports = { calcTCO, calcAll, autoTax, weightTaxPerShaken, residualRate, mileageAdjustedRate, shakenYears, DEFAULT_SETTINGS };
}
</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const state = { years: 5, annualKm: 10000, fuelPrice: 170, parkingMonthly: 0, insuranceAnnual: 60000, sell: true, buyAge: 0, filter: "all" };

  $("in-buyage").addEventListener("change", (e) => { state.buyAge = +e.target.value; render(); });

  const filteredCars = () => (state.filter === "all" ? CARS : CARS.filter((c) => c.segment === state.filter));

  $("seg-filter").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...$("seg-filter").children].forEach((b) => b.classList.toggle("on", b === btn));
    state.filter = btn.dataset.v;
    render();
  });

  const man = (n) => (n / 10000).toLocaleString("ja-JP", { maximumFractionDigits: 0 }) + "万";

  const SEGS = [["seg-sell", "sell"]];
  SEGS.forEach(([id, key]) => {
    $(id).addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      [...$(id).children].forEach((b) => b.classList.toggle("on", b === btn));
      state[key] = btn.dataset.v === "1";
      // 乗りつぶす選択時は保有年数を13年に自動変更(スライダーで手動変更は可)
      if (key === "sell" && !state.sell) {
        state.years = 13;
        $("in-years").value = 13;
        $("v-years").textContent = 13;
      }
      render();
    });
  });

  $("in-years").addEventListener("input", (e) => { state.years = +e.target.value; $("v-years").textContent = state.years; render(); });
  $("in-km").addEventListener("input", (e) => { state.annualKm = +e.target.value; $("v-km").textContent = state.annualKm.toLocaleString(); render(); });
  $("in-fuel").addEventListener("input", (e) => { state.fuelPrice = +e.target.value || 0; render(); });
  $("in-park").addEventListener("input", (e) => { state.parkingMonthly = +e.target.value || 0; render(); });
  $("in-ins").addEventListener("input", (e) => { state.insuranceAnnual = +e.target.value || 0; render(); });

  const KEYS = ["depreciation", "tax", "shaken", "fuel", "insurance", "parking", "consumables"];
  const COLORS = ["--c-dep", "--c-tax", "--c-shaken", "--c-fuel", "--c-ins", "--c-park", "--c-cons"].map((v) =>
    getComputedStyle(document.documentElement).getPropertyValue(v).trim()
  );

  function render() {
    const results = calcAll(filteredCars(), state);
    renderTable(results);
    renderHighlight(results);
    renderChart(results);
    renderSweep();
  }

  // 車種ごとの識別色(折れ線用)。全車種数に対応するためHSLで機械生成し、idに固定で割り当て
  const CAR_COLORS = {};
  CARS.forEach((c, i) => {
    CAR_COLORS[c.id] = `hsl(${Math.round((i * 360) / CARS.length)}, 65%, ${i % 2 ? 42 : 52}%)`;
  });
  const hiddenCars = new Set(); // 凡例クリックで非表示にした車種id

  $("sweep-legend").addEventListener("click", (e) => {
    const span = e.target.closest("span[data-id]");
    if (!span) return;
    const id = span.dataset.id;
    hiddenCars.has(id) ? hiddenCars.delete(id) : hiddenCars.add(id);
    renderSweep();
  });

  // 保有1〜15年スイープ: 年あたり実質コストの折れ線 + 最小コスト年マーカー
  function renderSweep() {
    const YEARS = [];
    for (let y = 1; y <= 15; y++) YEARS.push(y);
    // 「売り時」を見るビューなので売却前提。新車/中古トグル・セグメントフィルタは反映
    const series = filteredCars().map((car) => ({
      car,
      pts: YEARS.map((y) => calcTCO(car, { ...state, years: y, sell: true }).perYear),
    }));
    series.forEach((s) => {
      s.minIdx = s.pts.reduce((mi, v, i) => (v < s.pts[mi] ? i : mi), 0);
    });

    const cv = $("sweep");
    const dpr = window.devicePixelRatio || 1;
    const W = cv.parentElement.clientWidth - 4;
    const H = 340, padL = 60, padR = 16, padT = 12, padB = 28;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);
    ctx.font = "11px sans-serif";

    const visible = series.filter((s) => !hiddenCars.has(s.car.id));
    const allVals = (visible.length ? visible : series).flatMap((s) => s.pts); // 表示中の車種だけでスケール調整
    const maxV = Math.max(...allVals) * 1.05;
    const minV = 0;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const xAt = (i) => padL + (i / (YEARS.length - 1)) * plotW;
    const yAt = (v) => padT + plotH - ((v - minV) / (maxV - minV)) * plotH;

    // 目盛り(横グリッド + 縦=年)
    ctx.strokeStyle = "#e2e7ee";
    ctx.fillStyle = "#6b7686";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const step = maxV > 1500000 ? 500000 : 200000;
    for (let v = 0; v <= maxV; v += step) {
      const y = yAt(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText(man(v) + "円", padL - 6, y);
    }
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    YEARS.forEach((yr, i) => ctx.fillText(yr + "年", xAt(i), H - padB + 6));

    // 折れ線(非表示車種はスキップ)
    series.forEach((s) => {
      if (hiddenCars.has(s.car.id)) return;
      ctx.strokeStyle = CAR_COLORS[s.car.id];
      ctx.lineWidth = s.car.id === "jimny" ? 2 : 1.5;
      ctx.beginPath();
      s.pts.forEach((v, i) => (i ? ctx.lineTo(xAt(i), yAt(v)) : ctx.moveTo(xAt(i), yAt(v))));
      ctx.stroke();
    });
    // 最小コスト年マーカー(線の上に描く)
    series.forEach((s) => {
      if (hiddenCars.has(s.car.id)) return;
      const x = xAt(s.minIdx), y = yAt(s.pts[s.minIdx]);
      ctx.fillStyle = CAR_COLORS[s.car.id];
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    });

    // 凡例(最小コスト年つき・クリックで表示切替)
    $("sweep-legend").innerHTML = series
      .map((s) => {
        const off = hiddenCars.has(s.car.id);
        return `<span data-id="${s.car.id}" style="--sw:${CAR_COLORS[s.car.id]};cursor:pointer;${off ? "opacity:.35;text-decoration:line-through;" : ""}">${s.car.name}(${YEARS[s.minIdx]}年目 ${man(s.pts[s.minIdx])}円/年)</span>`;
      })
      .join("");
  }

  function renderTable(results) {
    $("tbody").innerHTML = results
      .map((r, i) => {
        const b = r.breakdown;
        return `<tr>
          <td class="rank">${i + 1}</td><td>${r.car.name}${r.car.confidence === "low" ? "※" : ""}</td>
          <td class="peryear">${man(r.perYear)}円</td><td>${man(r.total)}円</td>
          <td>${man(r.acquisition)}円</td><td>${r.salePrice ? man(r.salePrice) + "円" : "—"}</td>
          <td>${man(b.depreciation)}</td><td>${man(b.tax)}</td><td>${man(b.shaken)}</td>
          <td>${man(b.fuel)}</td><td>${man(b.insurance)}</td><td>${man(b.parking)}</td><td>${man(b.consumables)}</td>
        </tr>`;
      })
      .join("");
  }

  // 「意外な結論」: 新車価格が1.5倍以上高いのに年コストが安い組み合わせを検出
  function renderHighlight(results) {
    const el = $("highlight");
    let best = null;
    for (const hi of results) {
      for (const lo of results) {
        if (hi.car.price >= lo.car.price * 1.5 && hi.perYear < lo.perYear) {
          const gap = lo.perYear - hi.perYear;
          if (!best || gap > best.gap) best = { hi, lo, gap };
        }
      }
    }
    if (best) {
      el.style.display = "block";
      el.innerHTML = `💡 <b>意外な結論:</b> 新車価格が${man(best.hi.car.price)}円の<b>${best.hi.car.name}</b>は、` +
        `${man(best.lo.car.price)}円の<b>${best.lo.car.name}</b>より年あたり<b>${man(best.gap)}円安い</b>` +
        `(${man(best.hi.perYear)}円/年 vs ${man(best.lo.perYear)}円/年)。残価率の差が価格差を逆転させています。`;
    } else {
      el.style.display = "none";
    }
  }

  function renderChart(results) {
    const cv = $("chart");
    const dpr = window.devicePixelRatio || 1;
    const W = cv.parentElement.clientWidth - 4;
    const rowH = 34, padL = 150, padR = 70, padT = 10;
    const H = padT + results.length * rowH + 30;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    const ctx = cv.getContext("2d");
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);
    ctx.font = "12px sans-serif";

    const maxTotal = Math.max(...results.map((r) => r.total));
    const plotW = W - padL - padR;

    results.forEach((r, i) => {
      const y = padT + i * rowH;
      ctx.fillStyle = "#1e2530";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillText(r.car.name, padL - 8, y + rowH / 2, padL - 12);
      let x = padL;
      KEYS.forEach((k, ki) => {
        const w = (r.breakdown[k] / maxTotal) * plotW;
        if (w <= 0) return;
        ctx.fillStyle = COLORS[ki];
        ctx.fillRect(x, y + 6, w, rowH - 12);
        x += w;
      });
      ctx.fillStyle = "#6b7686";
      ctx.textAlign = "left";
      ctx.fillText(man(r.total) + "円", x + 6, y + rowH / 2);
    });
  }

  $("footer").textContent =
    `残価率は中古車掲載相場ベースの概算です。実際の売却額・保険料・整備費は条件により変動します。※印の車種は残価率に推定値を含みます。データ基準日: ${DATA_DATE}`;

  window.addEventListener("resize", render);
  render();
})();
</script>
</body>
</html>
